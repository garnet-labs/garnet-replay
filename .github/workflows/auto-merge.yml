name: auto-merge

on:
  pull_request:
    types: [ready_for_review, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI", "test"]
    types: [completed]
  status:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number || inputs.pr || github.event.check_suite.head_sha || github.event.workflow_run.head_sha || github.event.sha || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Evaluate and merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE_REPO: ${{ github.repository }}
          AUTO_MERGE_PR: ${{ github.event.pull_request.number || inputs.pr }}
          AUTO_MERGE_SHA: ${{ github.event.check_suite.head_sha || github.event.workflow_run.head_sha || github.event.sha }}
        run: |
          if [ ! -f bin/auto-merge.mjs ]; then
            echo "::notice::bin/auto-merge.mjs is not on the default branch yet; nothing to evaluate"
            exit 0
          fi
          if [ -n "$AUTO_MERGE_PR" ]; then
            node bin/auto-merge.mjs --repo "$AUTO_MERGE_REPO" --pr "$AUTO_MERGE_PR"
          else
            node bin/auto-merge.mjs --repo "$AUTO_MERGE_REPO" --sha "$AUTO_MERGE_SHA"
          fi
