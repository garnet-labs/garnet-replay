name: Stamphog Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: stamphog-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Stamphog deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read PR and run deterministic gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PYTHONPATH: ${{ github.workspace }}/tools/owners
          NO_COLOR: '1'
          TERM: dumb
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'invalid PR number'; exit 1; }
          git fetch origin "pull/${PR_NUMBER}/head"
          uv run tools/pr-approval-agent/review_pr.py "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" --dry-run --output-json verdict.json | tee review-output.txt
          {
            echo '## Stamphog deterministic gates'
            echo '```'
            cat review-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish sticky receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ ! -f verdict.json ]; then
            echo 'No verdict JSON; no verdict published.'
            exit 0
          fi
          python3 .github/scripts/stamphog-publish.py verdict.json "$GITHUB_REPOSITORY" "$PR_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stamphog-verdict
          path: |
            verdict.json
            review-output.txt
