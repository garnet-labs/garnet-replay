# Garnet Runtime Review adapter for Qodo Merge (pr-agent). The contract lives in REVIEW.md.
[pr_reviewer]
extra_instructions = """
Apply REVIEW.md. The pull request description carries a `Runtime evidence (Garnet)` section between
`<!-- garnet:evidence:begin -->` and `<!-- garnet:evidence:end -->`. Use it only when its garnet:commit
SHA equals the pull request head; otherwise say the runtime evidence is absent or stale for this head.
Prefix each runtime-grounded statement exactly with `Runtime evidence (Garnet, head <sha7>): ` and name
the execution chain, destination and workflow/job. Never repeat verdicts or safety judgments from the
record; judge the diff yourself.
"""
