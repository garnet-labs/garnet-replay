# Mirrors the head-bound Garnet Runtime Review comment into the pull request
# description so reviewers and agents that read only the description see the
# same bytes, then requests the configured reviewers once per head so they
# review with the record present. Runs from the default branch with the
# repository token after the recording workflow completes. It never checks out
# or executes pull request code.
name: Garnet evidence mirror

on: # zizmor: ignore[dangerous-triggers] default branch only, no pull request code runs here
  workflow_run:
    workflows: ["{{RECORD_WORKFLOW_NAME}}"]
    types: [completed]

permissions: {}

jobs:
  mirror:
    name: Mirror head-bound record into the description
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GARNET_REVIEWERS: "{{REVIEWERS}}"
      DEVIN_API_TOKEN: ${{ secrets.DEVIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Wait for the Runtime Review comment to settle
        run: sleep 45
      - name: Mirror into every open pull request at this head
        shell: bash
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number")
          if [ -z "${prs}" ]; then
            echo "No open pull request points at ${HEAD_SHA}; nothing to mirror."
            exit 0
          fi
          while IFS= read -r pr_number; do
            PR_NUMBER="${pr_number}" node .github/scripts/garnet-evidence-mirror.mjs
          done <<< "${prs}"
      - name: Request reviews once the record is bound (once per head)
        shell: bash
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number")
          if [ -z "${prs}" ]; then
            exit 0
          fi
          while IFS= read -r pr_number; do
            PR_NUMBER="${pr_number}" node .github/scripts/garnet-rereview.mjs
          done <<< "${prs}"
