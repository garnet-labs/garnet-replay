# Devin Review reviews each commit once, so a review that starts before the
# Garnet record finishes never sees it, and a later request for the same commit
# returns that first review. This workflow holds the pull request in draft
# while the head has no finalized Garnet record and labels it
# `garnet-review-hold`; the evidence mirror marks it Ready once the record for
# that head is final, and Devin Review (triggered on Ready) runs with the record
# present. Pull requests a person put in draft are never released: only the
# label set here is. Runs from the default branch with the repository token. It
# never checks out or executes pull request code; it reads the machine markers
# of the Garnet comment, never its prose.
name: Garnet review hold

on: # zizmor: ignore[dangerous-triggers] default branch only, no checkout, no pull request code runs here
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: garnet-review-hold-${{ github.event.pull_request.number }}

jobs:
  hold:
    name: Hold for the head-bound record
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # convert to draft and label the pull request
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: garnet-review-hold
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Return to draft until the record for this head is final
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          head=$(jq -r '.head.sha' <<<"${pr}")
          draft=$(jq -r '.draft' <<<"${pr}")
          node_id=$(jq -r '.node_id' <<<"${pr}")
          finalized=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            | jq -r --arg head "${head}" '
              [ .[][]
                | select(.user.login as $u | ["garnet-runtime-review[bot]","garnet-runtime-review-dev[bot]","garnet-ai[bot]"] | index($u) != null)
                | select(.body | contains("<!-- garnet-runtime-review -->"))
                | select(.body | contains("garnet-control-plane-pending-pr-comment") | not)
                | select((.body | capture("<!--\\s*garnet:commit\\s+(?<sha>[0-9a-f]{40})\\s*-->") | .sha) == $head)
                | (.body | capture("<!-- garnet:summary (?<json>\\{.*?\\}) -->") | .json | fromjson)
                | select(.status == null or .status == "finalized")
              ] | length > 0')
          echo "PR #${PR_NUMBER} head ${head:0:7}: finalized record=${finalized}, draft=${draft}"
          if [ "${finalized}" = "true" ]; then
            echo "The record for ${head:0:7} is final; nothing to hold."
            exit 0
          fi
          if [ "${draft}" != "true" ]; then
            gh api graphql -f query='mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' -f id="${node_id}" >/dev/null
            echo "Returned #${PR_NUMBER} to draft until the record for ${head:0:7} is final."
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=${LABEL}" >/dev/null
